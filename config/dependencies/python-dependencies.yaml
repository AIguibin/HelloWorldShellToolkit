# AIguibinCLI Python Dependencies Configuration
# Python版本要求
python_version: "3.13"
# Python包安装位置
site_packages_path: "python/Lib/site-packages"
# 依赖包列表
dependencies:
  # 核心依赖（必需）
  - name: rich
    version: ">=13.0.0"
    required: true
    description: Terminal UI library
    tags: [core, ui]

  - name: pyyaml
    version: ">=6.0"
    required: true
    description: YAML parser
    tags: [core, config]

  - name: pyreadline3
    version: ">=3.4.1"
    required: true
    description: Windows readline support
    tags: [core, platform]
    platform: win32

  - name: openpyxl
    version: ">=3.1.0"
    required: true
    description: Excel file operations
    tags: [core, excel]

# 可选依赖（用户按需安装）
optional_dependencies:
  - name: pandas
    version: ">=2.0.0"
    required: false
    description: Data analysis library
    tags: [optional, data]

  - name: numpy
    version: ">=1.24.0"
    required: false
    description: Numerical computing library
    tags: [optional, math]

  - name: requests
    version: ">=2.28.0"
    required: false
    description: HTTP library
    tags: [optional, network]

  - name: beautifulsoup4
    version: ">=4.12.0"
    required: false
    description: HTML/XML parser
    tags: [optional, web]

# 开发依赖（仅用于开发环境）
dev_dependencies:
  - name: pytest
    version: ">=7.0.0"
    required: false
    description: Testing framework
    tags: [dev, testing]

  - name: black
    version: ">=23.0.0"
    required: false
    description: Code formatter
    tags: [dev, linting]